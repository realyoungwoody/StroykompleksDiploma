name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Ruff
        run: ruff check app tests

      - name: Pytest
        env:
          DATABASE_URL: sqlite:///./ci-test.sqlite3
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: ci-only-password
          SESSION_SECRET: ci-only-session-secret-not-for-production
          LLM_MODE: demo
        run: pytest -q

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Production build
        run: npm run build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create isolated CI environment
        run: |
          cat > .env <<'EOF'
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=ci-only-password
          SESSION_SECRET=ci-only-session-secret-not-for-production
          DATABASE_URL=sqlite:////data/stroykompleks.sqlite3
          COOKIE_SECURE=false
          LLM_MODE=demo
          LLM_API_KEY=
          LLM_BASE_URL=
          LLM_MODEL=
          LLM_TIMEOUT_SECONDS=10
          EOF

      - name: Validate Compose configuration
        run: docker compose -p stroykompleks-ci config --quiet

      - name: Build images
        run: docker compose -p stroykompleks-ci build

      - name: Start containers
        run: docker compose -p stroykompleks-ci up -d

      - name: Wait for application and run smoke checks
        env:
          BASE_URL: http://127.0.0.1:8080
        run: |
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$BASE_URL/api/v1/health" >/dev/null && curl -fsS --max-time 5 "$BASE_URL/" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker compose -p stroykompleks-ci ps
          ./scripts/smoke_test.sh

      - name: Container diagnostics
        if: failure()
        run: docker compose -p stroykompleks-ci logs --no-color --tail=200

      - name: Stop CI containers
        if: always()
        run: docker compose -p stroykompleks-ci down --volumes --remove-orphans
