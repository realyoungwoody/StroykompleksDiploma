services:
  ollama:
    image: ollama/ollama:0.40.13
    profiles: ["local"]
    restart: unless-stopped
    expose:
      - "11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "4"
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-4g}
    cpus: ${OLLAMA_CPU_LIMIT:-4.0}
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:0.40.13
    profiles: ["local"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${LLM_MODEL:-qwen3:1.7b}
    volumes:
      - ./scripts/init_ollama.sh:/init_ollama.sh:ro
    entrypoint: ["/bin/sh", "/init_ollama.sh"]

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - stroykompleks_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  stroykompleks_data:
  ollama_models:

